<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>確率の求め方｜5つの類題</title>
<style>
:root{--navy:#102e5a;--blue:#123d79;--ink:#10203f;--yellow:#f0b51c;--red:#b82e44;--line:#cbd7e6}*{box-sizing:border-box}body{margin:0;background:#eef3f9;color:var(--ink);font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",system-ui,sans-serif;font-size:20px;line-height:1.8}button,select{font:inherit}button{cursor:pointer;border:1px solid #9bacbf;background:white;color:var(--navy);border-radius:10px;padding:.5rem 1rem;font-weight:700}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #d38c00;outline-offset:3px}header{background:var(--navy);color:white;padding:1rem max(1rem,calc((100% - 1180px)/2))}header p{margin:.35rem 0 0;line-height:1.6;font-size:1.1rem}.unit{font-weight:900;color:#ffe17a}nav{max-width:1180px;margin:1rem auto;display:flex;flex-wrap:wrap;gap:.5rem;padding:0 1rem}nav button{font-size:1rem}nav button[aria-current=true]{background:var(--navy);color:white}main{width:min(1180px,calc(100% - 2rem));margin:1.5rem auto;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.2fr);gap:2rem;align-items:start;min-height:530px}.step{color:#52647d;font-size:1rem;font-weight:bold}h1{font-size:clamp(1.8rem,3.3vw,2.6rem);line-height:1.4;margin:.7rem 0}p{margin:.7rem 0}strong{font-weight:900}.point{background:#fff6cf;border-left:5px solid var(--yellow);padding:1rem;margin-top:1.2rem}.visual{background:white;border:1px solid var(--line);border-radius:20px;padding:clamp(1rem,2.5vw,2rem);min-width:0;box-shadow:0 12px 30px #102e5a12}.visual h2{font-size:1.2rem;margin:0 0 .8rem}.eq{display:flex;align-items:center;justify-content:center;gap:.65rem;flex-wrap:wrap;font-family:Georgia,"Yu Mincho",serif;font-size:1.7rem;font-weight:bold;margin:1.2rem 0}.frac{display:inline-grid;grid-template-rows:1fr 1fr;align-items:center;text-align:center;line-height:1.3;vertical-align:middle}.frac>span{padding:.15em .3em}.frac>span:first-child{border-bottom:2px solid}.small{font-size:1rem;color:#52647d}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem}.tile{padding:.7rem .2rem;border:2px solid var(--line);border-radius:10px;text-align:center;background:#fff;font-weight:bold}.hit{border-color:var(--red)!important;background:#fff0f2!important;color:#9b2339!important}.legend{font-size:1rem;margin:.8rem 0}.mark{display:inline-block;border:2px solid var(--red);background:#fff0f2;padding:0 .5rem;color:#9b2339}.scroll{overflow:auto;max-width:100%;max-height:520px}table{border-collapse:collapse;width:100%;min-width:390px;text-align:center;font-size:1rem}th,td{border:1px solid #bacadd;padding:.45rem .15rem}th{background:#e8eef6}td.hit{outline:2px solid var(--red);outline-offset:-2px}.pairs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.4rem}.pairs .tile{font-size:1rem}.counts{display:grid;gap:.7rem}.counts div{padding:.8rem;background:#e8eef6;border-radius:9px}.counts b{color:var(--blue)}details{margin:1rem 0}summary{cursor:pointer;color:var(--blue);font-weight:bold}.perm-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.4rem;font-size:1rem}.perm-list span{padding:.35rem;border:1px solid #cbd7e6;border-radius:6px;text-align:center;white-space:nowrap}.tree{width:100%;height:auto;display:block}.tree text{font-family:inherit;font-size:17px}.tree path{fill:none;stroke:#91a7c2;stroke-width:2}footer{max-width:1180px;margin:1rem auto 2rem;padding:0 1rem;display:flex;align-items:center;justify-content:space-between;gap:.8rem}#next{background:var(--navy);color:white}.progress{height:6px;background:#ced9e7}.progress span{display:block;height:100%;background:var(--yellow)}select{max-width:100%;padding:.4rem;background:white;color:var(--ink);border:1px solid #9bacbf;border-radius:6px}.return{padding:1rem;border:2px solid var(--blue);border-radius:12px;background:#eef3f9}.visual ol{padding-left:1.5em}.visual li{margin:.6rem 0}@media(max-width:800px){main{grid-template-columns:1fr;gap:1rem;min-height:0}header p{font-size:1rem}body{font-size:19px}nav{margin:.7rem auto}nav button{padding:.4rem .65rem}footer{flex-wrap:wrap}.pairs{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(prefers-reduced-motion:no-preference){.visual{animation:enter .25s ease}@keyframes enter{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:none}}}
</style></head><body>
<header><div class="unit" id="unit"></div><p id="problem"></p></header><div class="progress"><span id="bar"></span></div><nav id="nav" aria-label="問題を選ぶ"></nav>
<main><section><div class="step" id="step"></div><h1 id="title" tabindex="-1"></h1><div id="lead"></div><div class="point" id="point"></div></section><section class="visual" id="visual" aria-label="図と式"></section></main>
<footer><button id="prev">← 戻る</button><span class="small" id="page"></span><button id="next">次へ →</button></footer>
<script>
'use strict';
const F=(n,d)=>'<span class="frac" aria-label="'+d+'分の'+n+'"><span>'+n+'</span><span>'+d+'</span></span>';
const E=(n,d,a,b)=>'<div class="eq"><span>P(A) =</span>'+F(n,d)+(a!==undefined?'<span>=</span>'+F(a,b):'')+'</div>';
const C=(n,r)=>'<span><sub>'+n+'</sub>C<sub>'+r+'</sub></span>';
const steps=[];const add=(u,t,l,p,v)=>steps.push({u,t,l,p,v});
const units=['めあて','① さいころ1個','② 硬貨','③ さいころ2個','④ 人の並び','⑤ 玉の取り出し','本問へ'];
const problems=['めあて：全体と条件に合う場合の数を求め、確率を説明できるようになろう。','類題｜公正なさいころを1個投げる。(1) 偶数の目が出る。(2) 5以下の目が出る。','類題｜公正な硬貨2枚を、互いに影響しないように同時に投げる。1枚だけ表が出る確率は？','類題｜公正なさいころ2個を、互いに影響しないように同時に投げる。(1) 和が8になる。(2) 2個とも奇数になる。','類題｜P・Q・R・S・Tの5人が、公平なくじで横一列に並ぶ。(1) Pが左端、Qが右端。(2) PとQが隣り合う。','類題｜同じ大きさの赤玉3個・白玉4個をよく混ぜ、どの2個も同じ確率で選ばれるように同時に取り出す。(1) 赤1個・白1個。(2) 2個とも赤。','MetaMoJiの本問を、自分の力で解こう。'];
const formula='<h2>同様に確からしいとき</h2><div class="eq"><span>P(A) =</span>'+F('条件に合う場合の数','全体の場合の数')+'</div><p class="small">事象Aは、今求めたい条件を満たす結果の集まり。</p>';
function dice(pred){return '<h2>起こりうる6個の結果</h2><div class="tiles">'+[1,2,3,4,5,6].map(n=>'<div class="tile '+(pred&&pred(n)?'hit':'')+'">'+n+'の目</div>').join('')+'</div>'+(pred?'<p class="legend"><span class="mark">色付き</span> 条件に合う結果</p>':'');}
function grid(pred){let h='<h2>縦：赤の目 ／ 横：青の目</h2><div class="scroll"><table><caption class="small">各マスは（赤の目, 青の目）。1マスが1通り。</caption><thead><tr><th scope="col">赤＼青</th>';for(let j=1;j<=6;j++)h+='<th scope="col">'+j+'</th>';h+='</tr></thead><tbody>';for(let i=1;i<=6;i++){h+='<tr><th scope="row">'+i+'</th>';for(let j=1;j<=6;j++)h+='<td class="'+(pred&&pred(i,j)?'hit':'')+'">'+i+','+j+'</td>';h+='</tr>';}return h+'</tbody></table></div>'+(pred?'<p class="legend"><span class="mark">色付き</span> 条件に合うマス</p>':'');}
const coinOut=['表表','表裏','裏表','裏裏'];
function coinTree(highlight){let h='<h2>1枚目 → 2枚目 → 完成</h2><svg class="tree" viewBox="0 0 460 285" role="img" aria-label="硬貨2枚の全4通りの樹形図">';h+='<text x="5" y="146">出発</text>';[0,1].forEach(i=>{let y=75+i*140;h+='<path d="M50 140 L130 '+y+'"/><text x="140" y="'+(y+6)+'">'+['表','裏'][i]+'</text>';[0,1].forEach(j=>{let k=i*2+j,yy=40+k*65;h+='<path d="M170 '+y+' L260 '+yy+'"/><text x="268" y="'+(yy+6)+'">'+['表','裏'][j]+'</text><rect x="320" y="'+(yy-20)+'" width="120" height="40" rx="8" fill="'+(highlight&&(k===1||k===2)?'#fff0f2':'#e8eef6')+'" stroke="'+(highlight&&(k===1||k===2)?'#b82e44':'#cbd7e6')+'"/><text x="348" y="'+(yy+6)+'">'+coinOut[k]+'</text>';});});return h+'</svg><p class="small">「表→裏」の順で枝を書くと、もれなく、重複なく整理できる。</p>';}
function perms(xs){return xs.length?xs.flatMap((x,i)=>perms(xs.filter((_,j)=>i!==j)).map(p=>[x,...p])):[[]];}
const allPerms=perms(['P','Q','R','S','T']);
function permCards(arr){return '<div class="perm-list">'+arr.map(p=>'<span>'+p.join('・')+'</span>').join('')+'</div>';}
function permPanel(){return '<h2>左端を決めて、続きを順序よく</h2><label for="first">左端の人：</label><select id="first">'+['P','Q','R','S','T'].map(x=>'<option>'+x+'</option>').join('')+'</select><p class="small">左端を1人に決めると、残りは24通り。下の一覧は左から順に、文字の順序で並べています。</p><div id="permContent"></div>';}
const balls=['赤1','赤2','赤3','白1','白2','白3','白4'];const pairs=balls.flatMap((a,i)=>balls.slice(i+1).map(b=>[a,b]));
function ballPairs(mode){return '<h2>番号を付けて、2個の組を区別する</h2><div class="pairs">'+pairs.map(p=>'<div class="tile '+((mode===1&&p[0][0]!==p[1][0]||mode===2&&p.every(x=>x[0]==='赤'))?'hit':'')+'">'+p.join('・')+'</div>').join('')+'</div><p class="small">上から各行を左→右へ。赤1・赤2と赤2・赤1は同じ組なので、1回だけ数える。</p>';}
add(0,'今日のめあて','<p><strong>全体</strong>と<strong>条件に合うもの</strong>を、同じ数え方で数えよう。</p><p>図で整理し、場合の数を使って確率を求めます。</p>','各類題の考え方を使って、最後はMetaMoJiの本問へ。',formula+'<ol><li>起こりうる結果を整理する</li><li><strong>同様に確からしい</strong>か確かめる</li><li>全体と条件に合うものを数える</li><li>分数にして約分する</li></ol>');
add(1,'まず、全体を見よう','<p>さいころ1個の結果は、1の目から6の目まで。</p><p>公正なさいころなので、この6個の<strong>根元事象は同様に確からしい</strong>と考えます。</p>','分母は、条件に関係なく全体の6通り。',dice());
add(1,'(1) 偶数だけを選ぼう','<p>今求めたい<strong>事象A</strong>は「偶数の目が出ること」。</p><p>6個の結果から、2・4・6を選びます。</p>','全体6通りのうち、条件に合うのは3通り。',dice(n=>n%2===0)+E(3,6,1,2));
add(1,'(2)「以下」は境目も含む','<p>今度の<strong>事象A</strong>は「5以下の目が出ること」。</p><p>1・2・3・4に、境目の5も入ります。</p>','「以上」「以下」は、その数自身も含む。',dice(n=>n<=5)+E(5,6));
add(1,'条件が変わっても、全体は同じ','<p>変わったのは、6個の中から選ぶ条件です。</p><p>本問でも、先に1〜6を書き、条件に合う目に印を付けましょう。</p>','分母の6を固定してから、分子を数える。','<div class="return"><strong>本問へ持っていく考え方</strong><p>「奇数」「○以上」なら、どの目を選ぶ？</p><p>境目の数を含めたか、もう一度確認しよう。</p></div>');
add(2,'同時でも、1枚ずつ区別しよう','<p>硬貨に「1枚目」「2枚目」と名前を付けます。</p><p><strong>表裏</strong>と<strong>裏表</strong>は、表になった硬貨が違うので別の結果です。</p>','ここでの順番は、投げる時刻ではなく、硬貨を見分けるための順番。',coinTree(false));
add(2,'枝の先は、全部で4通り','<p>1枚目に表・裏の2本。そのどちらからも、2枚目に表・裏の2本が出ます。</p><p>それぞれの硬貨が公正で、互いに影響しないので、この4通りは<strong>同様に確からしい</strong>と考えます。</p>','全体は2×2＝4通り。',coinTree(false));
add(2,'「1枚だけ表」を探そう','<p>表がちょうど1枚なのは、<strong>表裏・裏表</strong>です。</p><p>枝の先を1つずつ確かめると、条件に合うのは2通り。</p>','「だけ」は、ちょうどその枚数。表表は含めない。',coinTree(true)+E(2,4,1,2));
add(2,'表の枚数だけで分けると？','<p>「表0枚・表1枚・表2枚」の3種類は、同じ出やすさではありません。</p><p>表1枚に入る結果は、ほかより多いからです。</p>','3種類あるから分母を3にする、とは考えない。','<div class="counts"><div>表0枚：裏裏 → <b>1通り</b></div><div>表1枚：表裏・裏表 → <b>2通り</b></div><div>表2枚：表表 → <b>1通り</b></div></div><div class="return"><p>本問で硬貨が1枚増えたら、今の枝先からさらに表・裏の2本を伸ばそう。</p></div>');
add(3,'2個のさいころを見分けよう','<p>赤・青のさいころとして区別します。</p><p>（赤1, 青2）と（赤2, 青1）は別の結果。和が同じでも、1つにはまとめません。</p>','表の1マスが、2個のさいころの1つの結果。',grid());
add(3,'全体は6行×6列','<p>赤の目が1〜6のどれでも、青の目には6通りがあります。</p><p>36個の結果は<strong>同様に確からしい</strong>ので、確率の分母を36にできます。</p>','分母は6＋6ではなく、6×6＝36。',grid());
add(3,'(1) 和が8のマスを探そう','<p>赤の目を1、2、3…と順に見ます。青の目はいくつなら和が8になるでしょうか。</p><p>（2,6）（3,5）（4,4）（5,3）（6,2）の5通りです。</p>','（4,4）は1マス。入れ替えても同じ結果なので、2回数えない。',grid((a,b)=>a+b===8)+E(5,36));
add(3,'(2) 両方が奇数のマス','<p>赤の目を1・3・5に絞ります。その各行で、青の目も1・3・5を選びます。</p><p>3行×3列で、条件に合うのは9通り。</p>','「2個とも」は、赤も青も条件を満たすこと。',grid((a,b)=>a%2===1&&b%2===1)+E(9,36,1,4));
add(3,'和そのものは、同じ出やすさではない','<p>和が2になるのは（1,1）の1通り。和が8になるのは5通り。</p><p>確率を求めるときは、<strong>目の組</strong>を数えます。</p>','本問でも36マスを使い、和の条件・両方の目の条件を別々に探そう。','<div class="counts"><div>和が2：<b>1マス</b></div><div>和が8：<b>5マス</b></div></div><p>「和は2〜12の11種類だから、すべて同じ確率」ではありません。</p>');
add(4,'まず、条件なしで並べよう','<p>左から順に人を決めます。</p><p>左端は5人から選べます。1人使うたびに、次の場所の候補が1人ずつ減ります。</p>','公平なくじなので、完成した120通りの並びは同様に確からしい。','<h2>左端 → 2番目 → 3番目 → 4番目 → 右端</h2><div class="counts"><div>5通り → 4通り → 3通り → 2通り → 1通り</div></div><div class="eq">5! ＝ 5×4×3×2×1 ＝ 120</div>'+permPanel());
add(4,'(1) まず、両端を埋めよう','<p>「Pが左端、Qが右端」という条件があるので、先にその場所を決めます。</p><p>残った中央3か所へ、R・S・Tを並べましょう。</p>','両端は指定されているので、それぞれ1通り。','<h2>P ｜ □ ｜ □ ｜ □ ｜ Q</h2><p>中央の左から、3人 → 2人 → 1人と選ぶ。</p>'+permCards(perms(['R','S','T']).map(p=>['P',...p,'Q']))+'<div class="eq">3! ＝ 6通り</div>');
add(4,'条件付きの数を、全体で割る','<p>条件に合う並びは6通り。条件を付けない全体は120通りでした。</p><p>両端を固定した後の6通りは、<strong>分子</strong>です。</p>','分母まで「両端を固定した後の数」に変えない。','<h2>(1) Pが左端、Qが右端</h2>'+E(6,120,1,20));
add(4,'(2) 隣り合う2人を、かたまりに','<p>PとQが離れないように、ひとまず<strong>1つのかたまり</strong>として扱います。</p><p>並べるのは「かたまり・R・S・T」の4つです。</p>','今回は横一列。4つを並べるので4!通り。','<h2>［P・Q］　R　S　T</h2><div class="counts"><div>4つの並べ方：4×3×2×1＝<b>24通り</b></div></div><p>かたまりは左端でも中央でも右端でもよい。</p>');
add(4,'かたまりの中にも2通り','<p>かたまりの位置を決めても、中は<strong>PQ・QP</strong>の2通りあります。</p><p>外側の24通りのそれぞれに、この2通りが対応します。</p>','隣り合う順番は指定されていない。PQだけでなくQPも数える。','<h2>同じ位置でも、別の並び</h2>'+permCards([['R','P','Q','S','T'],['R','Q','P','S','T']])+'<div class="eq">4! × 2! ＝ 48通り</div>'+E(48,120,2,5)+'<details><summary>条件に合う全48通りを見る</summary>'+permCards(allPerms.filter(p=>Math.abs(p.indexOf('P')-p.indexOf('Q'))===1))+'</details>');
add(4,'本問でも、全体を先に確保しよう','<p>人数が変わったら、最初に「条件なしの並び」を数え直します。</p><p>その後で、両端固定と隣り合う条件を、それぞれ考えましょう。</p>','全体の並べ方と、条件に合う並べ方を、分けて書く。','<div class="return"><p><strong>両端指定：</strong>残る人は何人？</p><p><strong>隣り合う：</strong>かたまりにすると、並べるものはいくつ？ 中の順番は？</p></div>');
add(5,'同じ色でも、別々の玉','<p>見分けるために、赤1・赤2・赤3、白1・白2・白3・白4と番号を付けます。</p><p>番号の付いた2個の組は、どれも<strong>同様に確からしい</strong>と考えます。</p>','番号は数えるための目印。色が同じでも、玉そのものは別。',ballPairs(0));
add(5,'全体は、7個から2個を選ぶ','<p>同時に取り出すので、選ぶ順番は区別しません。</p><p>順に数える7×6では、同じ2個を逆順でも数えます。2!で割ると21通りです。</p>','全体も、条件に合うものも、「順番なしの2個の組」で数える。','<h2>全体の場合の数</h2><div class="eq">'+C(7,2)+'<span>=</span>'+F('7×6','2×1')+'<span>= 21</span></div>'+ballPairs(0));
add(5,'(1) 赤1個と白1個を選ぼう','<p>赤は3個から1個、白は4個から1個を選びます。</p><p>赤をどれに決めても、白の候補は4個。だから3×4＝12通り。</p>','赤から選ぶ・白から選ぶという役割があるので、さらに2で割らない。',ballPairs(1)+'<div class="eq">'+C(3,1)+'×'+C(4,1)+'＝12</div>'+E(12,21,4,7));
add(5,'(2) 赤3個から、2個を選ぶ','<p>赤だけの組は、赤1・赤2、赤1・赤3、赤2・赤3の3通りです。</p><p>分子は赤3個からの組合せ。分母は、袋全体7個からの組合せのままです。</p>','分子だけを赤玉に絞る。分母は全体の21通り。',ballPairs(2)+'<div class="eq">'+C(3,2)+'＝3</div>'+E(3,21,1,7));
add(5,'色の3種類を、等しく扱わない','<p>「赤赤・赤白・白白」の3種類には、それぞれ違う数の組が入っています。</p><p>番号を付けた玉の組へ戻れば、違いが見えます。</p>','本問では玉の数を置き換え、全体・赤白・赤赤を組合せで数えよう。','<div class="counts"><div>赤赤：'+C(3,2)+'＝<b>3通り</b></div><div>赤白：'+C(3,1)+'×'+C(4,1)+'＝<b>12通り</b></div><div>白白：'+C(4,2)+'＝<b>6通り</b></div></div><p>3＋12＋6＝21通り。色の組が3種類でも、それぞれの確率は同じではありません。</p>');
add(6,'今度は、自分の力で','<p>MetaMoJiを開き、本問に取り組もう。</p><p>式を書く前に、<strong>「何を1通りと数えるか」</strong>を決めると、分母と分子をそろえられます。</p>','迷ったら、必要な類題のボタンへ戻ろう。',formula+'<ol><li>さいころ1個：条件に合う目を選ぶ。</li><li>硬貨：1枚ずつ区別し、枝を伸ばす。</li><li>さいころ2個：目の組を36マスで整理する。</li><li>人の並び：全体を数え、固定・かたまりで絞る。</li><li>玉：番号を付け、順番なしで選ぶ。</li></ol>');
let index=0;const $=id=>document.getElementById(id);
function render(focus=false){const s=steps[index];$('unit').textContent='確率の求め方 ｜ '+units[s.u];$('problem').textContent=problems[s.u];$('step').textContent='STEP '+(steps.slice(0,index+1).filter(x=>x.u===s.u).length)+' / '+steps.filter(x=>x.u===s.u).length;$('title').textContent=s.t;$('lead').innerHTML=s.l;$('point').textContent=s.p;$('visual').innerHTML=s.v;$('page').textContent=(index+1)+' / '+steps.length;$('bar').style.width=((index+1)/steps.length*100)+'%';$('prev').disabled=index===0;$('next').disabled=index===steps.length-1;document.querySelectorAll('#nav button').forEach((b,i)=>b.setAttribute('aria-current',String(i===s.u)));if($('first')){const update=()=>{$('permContent').innerHTML=permCards(allPerms.filter(p=>p[0]===$('first').value));};$('first').onchange=update;update();}if(focus){$('title').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}}
units.forEach((u,i)=>{const b=document.createElement('button');b.textContent=u;b.onclick=()=>{index=steps.findIndex(s=>s.u===i);render(true);};$('nav').append(b);});$('prev').onclick=()=>{if(index>0){index--;render(true);}};$('next').onclick=()=>{if(index<steps.length-1){index++;render(true);}};document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA','BUTTON','SUMMARY'].includes(e.target.tagName))return;if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click();});render();
</script></body></html>
