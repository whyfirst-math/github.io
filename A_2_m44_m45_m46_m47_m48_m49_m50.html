<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>積事象・和事象と確率｜類題で学ぶ</title>
<style>
:root{--navy:#102e5a;--ink:#10203f;--line:#cbd7e6;--gold:#f0b51c;--blue:#1767a2;--red:#b82e44}*{box-sizing:border-box}body{margin:0;background:#eef3f9;color:var(--ink);font:20px/1.8 "Yu Gothic","Hiragino Kaku Gothic ProN",system-ui,sans-serif}button{font:inherit;cursor:pointer;padding:.5rem .9rem;border:1px solid #99acc5;border-radius:9px;color:var(--navy);background:#fff;font-weight:bold}button:disabled{opacity:.4;cursor:default}button:focus-visible,summary:focus-visible{outline:3px solid #c88600;outline-offset:3px}header{background:var(--navy);color:white;padding:1rem max(1rem,calc((100% - 1220px)/2))}header strong{color:#ffe17a}header p{margin:.35rem 0 0;font-size:1.12rem;line-height:1.65}.progress{height:6px;background:#cbd7e6}.progress span{display:block;height:100%;background:var(--gold)}nav{max-width:1220px;padding:0 1rem;margin:1rem auto;display:flex;flex-wrap:wrap;gap:.4rem}nav button{font-size:1rem;padding:.4rem .65rem}nav button[aria-current=true]{background:var(--navy);color:white}main{width:min(1220px,calc(100% - 2rem));margin:1.5rem auto;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:2rem;align-items:start;min-height:470px}h1{font-size:clamp(1.85rem,3.2vw,2.6rem);line-height:1.45;margin:.65rem 0 1rem}h2{font-size:1.25rem;margin:0 0 .8rem}p{margin:.7rem 0}strong{font-weight:900}.step,.small{font-size:1rem;color:#52647d}.step{font-weight:bold}.point{background:#fff6cf;border-left:5px solid var(--gold);padding:1rem;margin-top:1.2rem}.visual{background:white;padding:clamp(1rem,2.5vw,2rem);border:1px solid var(--line);border-radius:20px;min-width:0;box-shadow:0 12px 30px #102e5a12}.formula{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.5rem;font:700 clamp(1.25rem,2.3vw,1.75rem)/1.8 Georgia,"Yu Mincho",serif;margin:1.2rem 0}.formula>span{max-width:100%}.frac{display:inline-grid;grid-template-rows:1fr 1fr;align-items:center;text-align:center;line-height:1.25;vertical-align:middle;white-space:nowrap}.frac>span{padding:.14em .3em}.frac>span:first-child{border-bottom:2px solid currentColor}.over{text-decoration:overline}.setline{padding:.7rem;background:#e8eef6;border-radius:9px;margin:.6rem 0;overflow-wrap:anywhere}.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.4rem}.card{border:2px solid var(--line);border-radius:8px;padding:.3rem;text-align:center;background:white;font-weight:bold}.card small{display:block;font:700 .8rem/1.5 system-ui}.hit{background:#fff0f2!important;border-color:var(--red)!important;color:#9b2339!important}.onlya{background:#e9f4fc;border-color:#1767a2}.onlyb{background:#fff5d5;border-color:#a67a00}.both{background:#f0e9ff;border-color:#7050a4}.legend{font-size:1rem;margin:.6rem 0}.legend b{padding:0 .35rem;border-radius:4px}.regions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.4rem;margin:.8rem 0}.region{border:2px solid #ccd6e4;border-radius:10px;text-align:center;padding:.7rem .35rem;min-width:0}.region h3{font-size:1rem;margin:0 0 .5rem}.region p{font-weight:bold;margin:0;font-size:1.1rem}.outside{padding:.6rem;border:1px dashed #8ea0b8;margin:.6rem 0;text-align:center;font-size:1rem}.scroll{overflow:auto;max-width:100%;max-height:480px}table{border-collapse:collapse;width:100%;text-align:center;font-size:1.05rem}th,td{padding:.55rem .4rem;border:1px solid #bccbdd}th{background:#e8eef6}caption{font-size:1rem;margin:.4rem 0;color:#52647d}.matrix{min-width:300px}.matrix td.hit{outline:2px solid var(--red);outline-offset:-2px}.rows{display:grid;gap:.7rem}.row{padding:.8rem;background:#e8eef6;border-radius:9px}.return{padding:1rem;border:2px solid #123d79;border-radius:12px;background:#eef3f9}.controls{display:flex;flex-wrap:wrap;gap:.5rem;margin:.8rem 0}.controls button{font-size:1rem}.controls button[aria-pressed=true]{background:var(--navy);color:white}details{margin-top:1rem}summary{font-weight:bold;color:#123d79;cursor:pointer}.ball-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.4rem;font-size:1rem}.ball-list span{padding:.4rem;border:1px solid var(--line);border-radius:7px;text-align:center}.bar{display:flex;height:50px;margin:1rem 0;border:2px solid var(--navy);overflow:hidden;border-radius:8px}.bar>span{display:flex;align-items:center;justify-content:center;background:#e8eef6;font-weight:bold}.bar>span:first-child{background:#fff0f2;border-right:2px solid var(--red);color:#9b2339}footer{max-width:1220px;margin:1rem auto 2rem;padding:0 1rem;display:flex;justify-content:space-between;align-items:center;gap:1rem}#next{background:var(--navy);color:white}.visual ol{padding-left:1.4em}.visual li{margin:.5rem 0}@media(max-width:800px){main{grid-template-columns:1fr;gap:1rem;min-height:0}body{font-size:19px}header p{font-size:1rem}nav{margin:.65rem auto}nav button{font-size:.95rem}.regions{gap:.25rem}.region p{font-size:1rem}.cards{grid-template-columns:repeat(4,minmax(0,1fr))}footer{flex-wrap:wrap}}@media print{nav,footer,.controls{display:none}main{display:block}.visual{box-shadow:none;margin-top:1rem}header{color:#10203f;background:white}}
</style></head><body>
<header><strong id="unit"></strong><p id="problem"></p></header><div class="progress"><span id="bar"></span></div><nav id="nav" aria-label="学習する内容"></nav>
<main><section><div class="step" id="step"></div><h1 id="title" tabindex="-1"></h1><div id="lead"></div><div class="point" id="point"></div></section><section class="visual" id="visual" aria-label="図と式"></section></main>
<footer><button id="prev">← 戻る</button><span id="page" class="small"></span><button id="next">次へ →</button></footer>
<script>
'use strict';
const F=(n,d)=>'<span class="frac" aria-label="'+d+'分の'+n+'"><span>'+n+'</span><span>'+d+'</span></span>';
const eq=(...xs)=>'<div class="formula">'+xs.map(x=>'<span>'+x+'</span>').join('')+'</div>';
const C=(n,r)=>'<sub>'+n+'</sub>C<sub>'+r+'</sub>';
const comp='<span class="over">A</span>';
const set=xs=>xs.length?'{ '+xs.join(', ')+' }':'∅';
const nums=n=>Array.from({length:n},(_,i)=>i+1);
const choose=(xs,r)=>r===0?[[]]:xs.flatMap((x,i)=>choose(xs.slice(i+1),r-1).map(y=>[x,...y]));
const units=['めあて','① 積・和','② 排反','③ 基本性質','④ くじ','⑤ 同じ色','⑥ 倍数の和','⑦ 余事象','⑧ 2つの結果','本問へ'];
const problems=[
'めあて：条件の重なりを整理し、足す・重なりを引く・全体から引く方法を使い分けよう。',
'類題｜1〜12の番号札から、どれも同じ確率で1枚引く。A：偶数の番号、B：8以上の番号。A∩B、A∪Bを集合で表し、それぞれの確率を求めよう。',
'類題｜公正なさいころを1個投げる。A：偶数の目、B：3以下の目、C：5以上の目。互いに排反な事象の組を探そう。',
'確率の基本性質｜確率の範囲、全事象・空事象、排反な事象の和を整理しよう。',
'類題｜1本のくじが2つの等に同時に当たることはない。各等の確率は下の表の通り。指定した等のいずれかが当たる確率を求めよう。',
'類題｜赤玉1個・白玉3個・青玉4個から、3個同時に取り出す。どの3個の組も同じ確率で選ばれるとき、3個とも同じ色となる確率は？',
'類題｜1〜36の番号札から、どれも同じ確率で1枚引く。4の倍数または6の倍数の番号を引く確率は？',
'類題｜1〜80の番号札から、どれも同じ確率で1枚引く。6の倍数でない番号を引く確率は？',
'類題｜1〜4が同じ確率で出る赤・青のルーレットを、互いに影響しないように1回ずつ回す。(1) 少なくとも一方は3。(2) 異なる数が出る。',
'MetaMoJiの本問へ｜類題の数値と条件を、本問のものに置き換えて考えよう。'];
const steps=[];function add(u,t,l,p,v,widget){steps.push({u,t,l,p,v,widget});}
function cards(n,a,b,mode='class'){return '<div class="cards">'+nums(n).map(x=>{const aa=a(x),bb=b(x);const label=aa&&bb?'A・B':aa?'Aのみ':bb?'Bのみ':'どちらも×';const hit=mode==='and'?aa&&bb:mode==='or'?aa||bb:false;return '<div class="card '+(mode==='class'?(aa&&bb?'both':aa?'onlya':bb?'onlyb':''):hit?'hit':'')+'">'+x+'<small>'+label+'</small></div>';}).join('')+'</div>';}
const A=x=>x%2===0,B=x=>x>=8;
function regions(mode){const r=[{label:'Aだけ',xs:[2,4,6]},{label:'AとBの両方',xs:[8,10,12]},{label:'Bだけ',xs:[9,11]}];return '<h2>全事象 U：1〜12</h2><div class="regions">'+r.map((v,i)=>'<div class="region '+((mode==='and'&&i===1||mode==='or')?'hit':'')+'"><h3>'+v.label+'</h3><p>'+v.xs.join('・')+'</p></div>').join('')+'</div><div class="outside">どちらでもない：1・3・5・7</div><p class="small">各番号は、必ずどこか1か所に入っています。</p>';}
function explorer(){return '<h2>同じ札で、選ぶ条件を比べる</h2><div class="controls"><button data-view="and" aria-pressed="true">A∩B：かつ</button><button data-view="or" aria-pressed="false">A∪B：または</button></div><div id="setView"></div>';}
function lottery(active=[]){const v=[1,3,6,10];return '<div class="scroll"><table><caption>各等の当たる確率（同時に別の等には当たらない）</caption><thead><tr><th scope="col">等</th><th scope="col">確率</th></tr></thead><tbody>'+v.map((x,i)=>'<tr class="'+(active.includes(i+1)?'hit':'')+'"><th scope="row">'+(i+1)+'等</th><td>'+F(x,50)+'</td></tr>').join('')+'</tbody></table></div>';}
function grid(mode){return '<h2>縦：赤 ／ 横：青</h2><div class="scroll"><table class="matrix"><caption>1マスが（赤の数, 青の数）の1通り</caption><thead><tr><th scope="col">赤＼青</th>'+nums(4).map(n=>'<th scope="col">'+n+'</th>').join('')+'</tr></thead><tbody>'+nums(4).map(a=>'<tr><th scope="row">'+a+'</th>'+nums(4).map(b=>{const hit=mode==='neither'?a!==3&&b!==3:mode==='atleast'?a===3||b===3:mode==='same'?a===b:mode==='different'?a!==b:false;return '<td class="'+(hit?'hit':'')+'">'+a+','+b+'</td>';}).join('')+'</tr>').join('')+'</tbody></table></div><p class="small">色付きのマスが、今注目している事象。</p>';}
const balls=['赤1','白1','白2','白3','青1','青2','青3','青4'];const triples=choose(balls,3);const sameColor=triples.filter(t=>t.every(x=>x[0]===t[0][0]));
const basic=eq('0 ≤ P(A) ≤ 1')+eq('P(U) = 1','P(∅) = 0');
add(0,'今日のめあて','<p><strong>「かつ」「または」「〜でない」</strong>を、結果の集まりとして整理しよう。</p><p>どの結果を数えるのかが分かれば、確率の式を自分で選べます。</p>','まず事象を整理する。その後で、確率を計算する。','<div class="rows"><div class="row"><strong>かつ</strong>：両方に当てはまる</div><div class="row"><strong>または</strong>：少なくとも一方に当てはまる</div><div class="row"><strong>〜でない</strong>：全体の中で、その事象の外側</div></div>');
add(1,'まずAとBを書き出そう','<p>Aは偶数、Bは8以上です。それぞれに入る番号を、小さい順に書きます。</p><p>同じ番号が、AにもBにも入っていてかまいません。</p>','8・10・12は、2つの条件を両方満たす。','<div class="setline">A = '+set([2,4,6,8,10,12])+'</div><div class="setline">B = '+set([8,9,10,11,12])+'</div>'+cards(12,A,B));
add(1,'積事象は「AかつB」','<p><strong>積事象 A∩B</strong>は、AとBが<strong>ともに起こる</strong>事象です。</p><p>偶数で、しかも8以上の番号だけを選びます。</p>','∩は、共通する部分。「積」という名前だけで確率を掛けない。',regions('and')+'<div class="setline">A∩B = '+set([8,10,12])+'</div>');
add(1,'和事象は「AまたはB」','<p><strong>和事象 A∪B</strong>は、AとBの<strong>少なくとも一方が起こる</strong>事象です。</p><p>Aだけ、Bだけ、両方のどれでも入ります。</p>','「または」は、両方に当てはまる番号も含む。',regions('or')+'<div class="setline">A∪B = '+set([2,4,6,8,9,10,11,12])+'</div>');
add(1,'同じ図で、違いを確かめよう','<p>ボタンで「かつ」と「または」を切り替えてみましょう。</p><p>両方に入る番号は、どちらの事象にも含まれます。</p>','集合には、同じ番号を重複して書かない。',explorer(),'sets');
add(1,'集合の要素を数えて、確率へ','<p>12枚はどれも同じ確率で選ばれます。分母は、全体の12通り。</p><p>積事象には3個、和事象には8個の番号があります。</p>','集合を答える問いと、確率を答える問いを区別しよう。','<h2>積事象の確率</h2>'+eq('P(A∩B) =',F(3,12),'=',F(1,4))+'<h2>和事象の確率</h2>'+eq('P(A∪B) =',F(8,12),'=',F(2,3)));
add(2,'排反かどうかも、共通部分を見る','<p>さいころの目を、A・B・Cに分けて書きます。</p><p>「同じ1回の試行で、2つの条件を一緒に満たす目があるか」を調べましょう。</p>','事象は3つ。AとB、AとC、BとCの3組を調べる。','<div class="setline">A：偶数 = { 2, 4, 6 }</div><div class="setline">B：3以下 = { 1, 2, 3 }</div><div class="setline">C：5以上 = { 5, 6 }</div>');
add(2,'共通する目を、1組ずつ探そう','<p>AとBには2、AとCには6が共通しています。</p><p>BとCを両方満たす目はありません。</p>','共通する結果がない集合を、空集合 ∅ で表す。','<div class="scroll"><table><thead><tr><th>組</th><th>共通部分</th><th>同時に起こる？</th></tr></thead><tbody><tr><td>AとB</td><td>{ 2 }</td><td>起こりうる</td></tr><tr><td>AとC</td><td>{ 6 }</td><td>起こりうる</td></tr><tr class="hit"><td>BとC</td><td>∅</td><td>起こらない</td></tr></tbody></table></div>');
add(2,'「同時に起こらない」が排反','<p>2つの事象の共通部分がないとき、<strong>互いに排反</strong>といいます。</p><p>この類題では、BとCが互いに排反です。</p>','別の名前が付いているだけでは排反とはいえない。','<h2>排反の判定</h2>'+eq('B∩C = ∅')+'<div class="regions"><div class="region"><h3>B</h3><p>1・2・3</p></div><div class="region"><h3>どちらでもない</h3><p>4</p></div><div class="region"><h3>C</h3><p>5・6</p></div></div><p class="small">排反でも、2つを合わせて全体になるとは限りません。</p>');
add(3,'確率は0から1の間','<p><strong>全事象 U</strong>は必ず起こるので、確率は1。</p><p><strong>空事象 ∅</strong>は起こらないので、確率は0です。どの事象の確率も、この範囲に入ります。</p>','計算結果が負の数や1より大きくなったら、数え方を見直そう。',basic+'<p class="small">Uは、起こりうる結果をすべて集めたものです。</p>');
add(3,'排反なら、確率をそのまま足せる','<p>重なりがなければ、Aに入る結果とBに入る結果を合わせても、同じ結果を2回数えることはありません。</p><p>これが、<strong>排反な事象の加法定理</strong>です。</p>','「または」だから足す前に、重なりがないか確かめる。','<h2>AとBが互いに排反なら</h2>'+eq('P(A∪B) =','P(A) + P(B)')+'<div class="row">A∩B = ∅ が、ここでの条件。</div>');
add(3,'ここまでの基本性質','<p>まずはこの3点を、図の意味と一緒に押さえましょう。</p><p>次のくじの問題では、排反な事象を足す性質を使います。</p>','3つ以上でも、どの2つも排反なら、まとめて確率を足せる。',basic+'<div class="row"><strong>互いに排反なら</strong>'+eq('P(A∪B) =','P(A) + P(B)')+'</div>');
add(4,'どの等も、同時には当たらない','<p>くじを1本引いて、1等と2等が同時に当たることはありません。ほかの等の組でも同じです。</p><p>各等の当たる事象は、<strong>どの2つも排反</strong>です。</p>','この表は、場合の数ではなく、各等の確率を示している。',lottery()+'<p class="small">残りは、いずれの等も当たらない場合です。</p>');
add(4,'(1) 1等または2等','<p>条件に入る行は、1等と2等の2行です。</p><p>互いに排反なので、この2つの確率を足します。</p>','分母が同じ分数の足し算では、分子を足す。',lottery([1,2])+eq(F(1,50),'+',F(3,50),'=',F(4,50),'=',F(2,25)));
add(4,'(2) 1等から3等までのいずれか','<p>「1等から3等まで」は、1等・2等・3等を全部含みます。</p><p>端の1等と3等だけでなく、間の2等も選びます。</p>','「いずれか」は、選んだ事象の和。',lottery([1,2,3])+eq(F(1,50),'+',F(3,50),'+',F(6,50),'=',F(10,50),'=',F(1,5)));
add(4,'(3) 3等または4等','<p>今度は、3等と4等の行だけを選びます。</p><p>選ぶ行が変わっても、排反なので足せるという理由は同じです。</p>','まず表のどの行を選ぶかを決めよう。',lottery([3,4])+eq(F(6,50),'+',F(10,50),'=',F(16,50),'=',F(8,25)));
add(4,'(4) 2等から4等までのいずれか','<p>2等・3等・4等の3行を選びます。</p><p>どの2つも同時には当たらないので、3つの確率を足します。</p>','本問でも「選ぶ行に印 → 確率を足す」の順で考えよう。',lottery([2,3,4])+eq(F(3,50),'+',F(6,50),'+',F(10,50),'=',F(19,50)));
add(5,'「同じ色」を、色ごとに分けよう','<p>3個とも同じ色とは、<strong>赤3個、白3個、青3個のいずれか</strong>です。</p><p>3個取り出した1つの結果が、赤3個と白3個に同時になることはありません。</p>','色ごとの場合は互いに排反。数えた後に足せる。','<div class="rows"><div class="row">赤3個：赤は1個だけなので不可能</div><div class="row">白3個：白3個から選ぶ</div><div class="row">青3個：青4個から選ぶ</div></div>');
add(5,'まず全体：8個から3個を選ぶ','<p>玉に番号を付けて区別します。同時に取り出すので、選ぶ順番は区別しません。</p><p>どの3個の組も同じ確率で選ばれるため、組合せで数えられます。</p>','分母は、色の条件を付けない全体。','<div class="setline">赤1・白1・白2・白3・青1・青2・青3・青4</div>'+eq(C(8,3),'=',F('8×7×6','3×2×1'),'= 56')+'<p>順番を付けると、同じ3個を3!回ずつ数えるので割ります。</p>');
add(5,'色ごとに数えて、足そう','<p>白3個は1通り。青3個は、青4個から3個を選ぶので4通りです。</p><p>赤3個は0通り。条件に合う組は0＋1＋4＝5通りです。</p>','赤玉が足りない場合も、0通りとして確かめる。','<h2>条件に合う5組</h2><div class="ball-list">'+sameColor.map(t=>'<span>'+t.join('・')+'</span>').join('')+'</div>'+eq('0 + '+C(3,3)+' + '+C(4,3),'= 0 + 1 + 4 = 5'));
add(5,'排反だから、3つの確率を足せる','<p>「赤3個または白3個または青3個」の確率を求めます。</p><p>分母を56にそろえると、条件に合う場合の数を足す方法とつながります。</p>','本問でも、全体から3個を選ぶ数と、各色から3個を選ぶ数を分けよう。',eq(F(0,56),'+',F(1,56),'+',F(4,56),'=',F(5,56))+'<div class="return">どの色なら3個取れる？ 色ごとの場合は重ならない？</div>');
add(6,'今回は、重なりがある','<p>Aを4の倍数、Bを6の倍数の事象とします。</p><p>12・24・36は、4の倍数でも6の倍数でもあります。</p>','前のくじ・色分けとの違いは、共通する結果があること。','<div class="setline">A = { 4, 8, 12, 16, 20, 24, 28, 32, 36 }</div><div class="setline">B = { 6, 12, 18, 24, 30, 36 }</div><div class="setline">A∩B = { 12, 24, 36 }</div>');
add(6,'それぞれの個数を数えよう','<p>4の倍数は4×1から4×9までで9個。6の倍数は6個です。</p><p>共通するのは、4と6の<strong>最小公倍数12の倍数</strong>なので3個です。</p>','共通部分を探すときは「両方の倍数」を考える。','<div class="rows"><div class="row">4の倍数：36÷4＝9個</div><div class="row">6の倍数：36÷6＝6個</div><div class="row">両方の倍数：36÷12＝3個</div></div>');
add(6,'足すと、同じ札を2回数える','<p>9＋6の中では、12・24・36をそれぞれ2回数えています。</p><p>それぞれ1回に戻すため、共通部分の3個を<strong>1回分だけ引きます</strong>。</p>','共通部分を除外するのではなく、2回を1回に直す。','<div class="regions"><div class="region"><h3>Aだけ</h3><p>6個</p></div><div class="region hit"><h3>AとBの両方</h3><p>3個</p></div><div class="region"><h3>Bだけ</h3><p>3個</p></div></div>'+eq('9 + 6 − 3 = 12個')+'<div class="setline">A∪B = { 4, 6, 8, 12, 16, 18, 20, 24, 28, 30, 32, 36 }</div>');
add(6,'重なりがあるときの加法定理','<p>「全体36個のうち12個」を、確率の式で表します。</p><p>先ほどの排反な場合は、引く共通部分が0だったのです。</p>','和事象では、共通部分の確率を1回引く。','<h2>一般の加法定理</h2>'+eq('P(A∪B) =','P(A) + P(B)','− P(A∩B)')+eq(F(9,36),'+',F(6,36),'−',F(3,36),'=',F(12,36),'=',F(1,3))+'<div class="return">本問でも、それぞれの倍数と共通の倍数を数えよう。最後の倍数が上限を超えていないか確認しよう。</div>');
add(7,'「〜でない」を、全体の中で考える','<p><strong>余事象</strong>は、全事象Uの中で<strong>Aが起こらない</strong>事象です。</p><p>Aの余事象を '+comp+' と書き、「エー・バー」と読みます。</p>','余事象は、今決めた全体Uの中での残り。','<h2>全事象 U</h2><div class="regions"><div class="region hit"><h3>A</h3><p>起こる</p></div><div class="region" style="grid-column:span 2"><h3>'+comp+'</h3><p>Aが起こらない</p></div></div><p class="small">この図の面積は、確率の大きさを表していません。</p>');
add(7,'余事象の2つの関係','<p>Aとその余事象は、同時に起こりません。また、合わせると全体をすべて覆います。</p><p>排反というだけでなく、<strong>どちらか一方は必ず起こる</strong>関係です。</p>','排反な2つの事象が、いつも余事象の関係になるわけではない。',eq('A∩'+comp+' = ∅')+eq('A∪'+comp+' = U')+'<div class="row">排反の類題のBとCでは、4の目がどちらにも入らなかった。だから互いの余事象ではありません。</div>');
add(7,'全体の確率1から引けばよい','<p>Aとその余事象は排反で、合わせると全体です。</p><p>だから2つの確率の和は1。片方が分かれば、1から引いてもう片方を求められます。</p>','「条件に合うもの」より「合わないもの」が数えやすいときに使う。',eq('P(A) + P('+comp+') = 1')+eq('P('+comp+') = 1 − P(A)')+eq('P(A) = 1 − P('+comp+')'));
add(7,'6の倍数を数える方が短い','<p>ここではAを「6の倍数を引く」とします。求めたいのは、その余事象です。</p><p>6×13＝78までは入りますが、6×14＝84は80を超えます。</p>','80÷6の整数部分を使い、6の倍数は13個。','<div class="setline">6・12・18・24・30・36・42・48・54・60・66・72・78</div><div class="row">次の84は範囲の外。</div>'+eq('P(A) =',F(13,80)));
add(7,'残りの67個を、まとめて数える','<p>全体80個から、6の倍数13個を除けば、6の倍数でない番号は67個です。</p><p>「個数で引く」と「確率を1から引く」は、同じ考え方です。</p>','1は、分母をそろえると80分の80。','<div class="bar" aria-label="全80個のうち倍数13個、倍数でない67個"><span style="width:16.25%">13</span><span style="width:83.75%">67</span></div>'+eq('P('+comp+') =','1 −',F(13,80),'=',F('80−13',80),'=',F(67,80))+'<div class="return">本問では上限と倍数の条件を置き換え、最後の倍数を確かめよう。</div>');
add(8,'まず16個の結果をそろえる','<p>赤も青も1〜4が同じ確率で出て、互いに影響しません。</p><p>（赤1, 青2）と（赤2, 青1）は別の結果。4×4＝16通りは<strong>同様に確からしい</strong>と考えます。</p>','2つの結果を区別し、分母を16にそろえる。',grid('all'));
add(8,'(1)「少なくとも一方は3」とは？','<p>赤だけ3、青だけ3、両方とも3のすべてを含みます。</p><p>「ちょうど一方」と違い、（3,3）も条件に入ります。</p>','少なくとも一方は3 ＝ 1つ以上が3。',grid('atleast'));
add(8,'反対は「どちらも3ではない」','<p>Aを「少なくとも一方は3」とすると、その余事象は<strong>両方とも3以外</strong>です。</p><p>「両方とも3」ではありません。それはAの中に入っています。</p>','1つ以上が3、の反対は、3が0個。',grid('neither')+'<div class="setline">赤も青も、候補は1・2・4。</div>');
add(8,'余事象の9通りを引こう','<p>赤が3以外は3通り。そのどの場合にも、青が3以外は3通りあります。</p><p>余事象は3×3＝9通りなので、求める確率は1から引けます。</p>','全体16通りから、両方とも3以外の9通りを除く。',grid('neither')+eq('P(A) =','1 −',F(9,16),'=',F(7,16)));
add(8,'図を切り替えて、残りを確かめよう','<p>9マスを除いた残りが7マスです。（3,3）も、求めたい事象に含まれています。</p><p>直接数えるなら、赤が3の4マスと青が3の4マスから、重なる1マスを引けます。</p>','余事象で16−9。和事象で4＋4−1。どちらも7通り。','<div class="controls"><button data-grid="atleast" aria-pressed="true">求めたい事象</button><button data-grid="neither" aria-pressed="false">余事象</button></div><div id="gridView"></div>','grid');
add(8,'(2)「異なる」の反対は「同じ」','<p>赤と青が異なる組を全部探す前に、同じ数になる組を数えてみましょう。</p><p>（1,1）（2,2）（3,3）（4,4）の4通りだけです。</p>','「同じ数」と「異なる数」は、重ならず、合わせると全体。',grid('same'));
add(8,'同じ4通りを、全体から引く','<p>Aを「異なる数が出る」とすると、余事象は「同じ数が出る」です。</p><p>同じ4通りを除くと、異なる数は12通りです。</p>','本問のさいころでは、表を6行×6列に広げて考えよう。',grid('different')+eq('P(A) =','1 −',F(4,16),'=',F(12,16),'=',F(3,4)));
add(9,'どの式を使うか、理由も添えよう','<p>MetaMoJiの本問に取り組もう。はじめに、求める事象を言葉で書きます。</p><p>「重なりがない」「重なりがある」「反対の方が数えやすい」のどれかを確かめ、式を選びましょう。</p>','集合を表すときは番号を並べる。確率を求めるときは、その個数を全体の個数で割る。','<div class="rows"><div class="row"><strong>かつ：</strong>共通する結果を選ぶ。</div><div class="row"><strong>または・排反：</strong>そのまま確率を足す。</div><div class="row"><strong>または・重なりあり：</strong>足して、共通部分を1回引く。</div><div class="row"><strong>〜でない・少なくとも：</strong>反対の事象を言葉にして、1から引けないか考える。</div></div><details><summary>公式をもう一度見る</summary>'+basic+eq('P(A∪B) =','P(A) + P(B)','− P(A∩B)')+eq('P(A) = 1 − P('+comp+')')+'</details>');
let index=0;const $=id=>document.getElementById(id);
function render(focus=false){const s=steps[index];$('unit').textContent='積事象・和事象と確率 ｜ '+units[s.u];$('problem').textContent=problems[s.u];$('step').textContent='STEP '+steps.slice(0,index+1).filter(x=>x.u===s.u).length+' / '+steps.filter(x=>x.u===s.u).length;$('title').textContent=s.t;$('lead').innerHTML=s.l;$('point').textContent=s.p;$('visual').innerHTML=s.v;$('page').textContent=(index+1)+' / '+steps.length;$('bar').style.width=(index+1)/steps.length*100+'%';$('prev').disabled=index===0;$('next').disabled=index===steps.length-1;document.querySelectorAll('#nav button').forEach((b,i)=>b.setAttribute('aria-current',String(i===s.u)));
if(s.widget==='sets'){const update=mode=>{document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===mode)));$('setView').innerHTML=cards(12,A,B,mode)+'<div class="setline">'+(mode==='and'?'A∩B = '+set([8,10,12]):'A∪B = '+set([2,4,6,8,9,10,11,12]))+'</div><p class="small">赤い枠の札が、選んだ事象に入る番号です。</p>';};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>update(b.dataset.view));update('and');}
if(s.widget==='grid'){const update=mode=>{document.querySelectorAll('[data-grid]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.grid===mode)));$('gridView').innerHTML=grid(mode);};document.querySelectorAll('[data-grid]').forEach(b=>b.onclick=()=>update(b.dataset.grid));update('atleast');}
if(focus){$('title').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}}
units.forEach((u,i)=>{const b=document.createElement('button');b.textContent=u;b.onclick=()=>{index=steps.findIndex(s=>s.u===i);render(true);};$('nav').append(b);});$('prev').onclick=()=>{if(index>0){index--;render(true);}};$('next').onclick=()=>{if(index<steps.length-1){index++;render(true);}};document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA','BUTTON','SUMMARY'].includes(e.target.tagName))return;if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click();});render();
</script></body></html>
